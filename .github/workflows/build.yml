name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: make test
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityProxy-app
          path: build/test/Antigravity Proxy.app
          if-no-files-found: error
